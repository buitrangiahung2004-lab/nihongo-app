<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f6bff">
<meta name="description" content="Ứng dụng học tiếng Nhật từ con số 0 đến JLPT N3 cho người Việt – chạy offline trong một file HTML.">
<title>Nihongo Zero → N3 · Học tiếng Nhật cho người Việt</title>
<style>
:root{
  --bg:#f5f6fb; --card:#ffffff; --card2:#f8f9fd; --text:#1d2233; --muted:#6b7285; --line:#e5e8f0;
  --pri:#4f6bff; --pri-soft:#e9edff; --ok:#16a34a; --ok-soft:#dcfce7; --bad:#dc2626; --bad-soft:#fee2e2;
  --info:#2563eb; --info-soft:#dbeafe; --xp:#d97706; --xp-soft:#fef3c7; --srs:#8b5cf6; --srs-soft:#ede9fe;
  --shadow:0 2px 14px rgba(25,35,80,.07); --r:16px; --r-sm:10px;
  --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic","Meiryo","MS Gothic",sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,var(--jp);
}
[data-theme="dark"]{
  --bg:#0f1220; --card:#181c2e; --card2:#1f2438; --text:#e8eaf3; --muted:#9aa1b8; --line:#2b3148;
  --pri:#7c8cff; --pri-soft:#262c4f; --ok:#4ade80; --ok-soft:#173326; --bad:#f87171; --bad-soft:#3b1d22;
  --info:#60a5fa; --info-soft:#1a2a45; --xp:#fbbf24; --xp-soft:#3a2e12; --srs:#a78bfa; --srs-soft:#2b2447;
  --shadow:0 2px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--ui);background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.jp,ruby,.big-jp{font-family:var(--jp)}
rt{font-size:.55em;color:var(--muted);font-weight:400}
.hide-furi rt{visibility:hidden}
.hide-romaji .romaji{display:none}
.hide-trans .trans{display:none}
.hide-jp .jp-line{filter:blur(8px);transition:filter .2s}
.hide-jp .jp-line:hover{filter:none}
.mobile-brand{display:none;align-items:center;gap:8px;font-weight:800}
.mobile-brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--pri),var(--srs));color:#fff;display:grid;place-items:center}
@media (max-width:900px){.mobile-brand{display:flex}}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
h1,h2,h3{margin:.2em 0 .5em;line-height:1.25}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1.05rem}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 10px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font-weight:800}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--srs));color:#fff;display:grid;place-items:center;font-family:var(--jp);font-size:20px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--text);text-decoration:none;font-size:.95rem}
.nav a:hover{background:var(--card2)}
.nav a.on{background:var(--pri-soft);color:var(--pri);font-weight:700}
.nav .ic{width:22px;text-align:center}
.main{flex:1;min-width:0;padding:22px 26px 90px;max-width:1100px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.topbar .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.85rem;font-weight:600;white-space:nowrap}
.pill.xp{color:var(--xp)} .pill.fire{color:#ea580c}
.bottom-nav{display:none}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom));z-index:51;max-height:80vh;overflow:auto;display:none}
.sheet .nav{display:grid;grid-template-columns:1fr 1fr;gap:4px}
@media (max-width:900px){
  .side{display:none}
  .main{padding:14px 14px 96px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  .bottom-nav a,.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:.7rem;color:var(--muted);text-decoration:none;background:none;border:0}
  .bottom-nav .ic{font-size:1.25rem}
  .bottom-nav .on{color:var(--pri);font-weight:700}
  body.sheet-open .sheet,body.sheet-open .sheet-bg{display:block}
}

/* ---------- Components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card.soft{background:var(--card2);box-shadow:none}
.card.info{border-color:var(--info);background:var(--info-soft)}
.card.warn{border-color:var(--xp);background:var(--xp-soft)}
.card.srs{border-color:var(--srs);background:var(--srs-soft)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
@media (max-width:700px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.ok{color:var(--ok)} .bad{color:var(--bad)} .xpc{color:var(--xp)} .srsc{color:var(--srs)} .infoc{color:var(--info)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;transition:transform .08s,background .15s;text-decoration:none;color:var(--text);min-height:42px}
.btn:hover{background:var(--card2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.srs{background:var(--srs);border-color:var(--srs);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.big{padding:15px 22px;font-size:1.05rem;border-radius:14px}
.btn.sm{padding:6px 11px;min-height:34px;font-size:.85rem;border-radius:9px}
.btn.icon{width:42px;padding:0}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.chip.n5{background:#dcfce7;color:#166534;border-color:#bbf7d0} .chip.n4{background:#dbeafe;color:#1e40af;border-color:#bfdbfe} .chip.n3{background:#fae8ff;color:#86198f;border-color:#f5d0fe} .chip.beg{background:#fef3c7;color:#92400e;border-color:#fde68a}
[data-theme="dark"] .chip.n5{background:#173326;color:#86efac;border-color:#1f4d33}
[data-theme="dark"] .chip.n4{background:#1a2a45;color:#93c5fd;border-color:#264067}
[data-theme="dark"] .chip.n3{background:#3a1b40;color:#f0abfc;border-color:#572a60}
[data-theme="dark"] .chip.beg{background:#3a2e12;color:#fcd34d;border-color:#5a4719}
.bar{height:10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--srs));border-radius:999px;transition:width .4s}
.bar.okb>i{background:var(--ok)} .bar.xpb>i{background:var(--xp)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .v{font-size:1.55rem;font-weight:800;line-height:1.1}
.stat .l{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:thin}
.tabs button,.tabs a{flex:none;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.88rem;font-weight:600;text-decoration:none;color:var(--text)}
.tabs .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-weight:600;font-size:.9rem}
.input,select.input{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);width:100%;min-height:42px}
.input:focus{outline:2px solid var(--pri);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:8px 13px;font-weight:600;font-size:.88rem}
.seg button.on{background:var(--pri);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.item .grow{flex:1;min-width:0}
.item .jpw{font-family:var(--jp);font-size:1.25rem;font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:100;font-weight:600;box-shadow:var(--shadow);max-width:90vw;text-align:center;animation:pop .25s}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,30,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--card);border-radius:18px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:20px;position:relative}
.modal .x{position:absolute;right:12px;top:12px}
.speak{border:1px solid var(--line);background:var(--card2);border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;font-size:1rem;flex:none}
.speak:hover{background:var(--pri-soft)}
.speak.lg{width:56px;height:56px;font-size:1.5rem}
.speaking{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--pri-soft)}}
@keyframes pop{0%{transform:translateX(-50%) scale(.9);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.hr{height:1px;background:var(--line);margin:14px 0}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:.78rem;color:var(--muted);font-weight:700}
.tbl-wrap{overflow-x:auto}

/* ---------- Kana grid ---------- */
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.kgrid.y3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kcell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;transition:transform .1s,border-color .15s;position:relative}
.kcell:hover{border-color:var(--pri);transform:translateY(-2px)}
.kcell .c{font-family:var(--jp);font-size:1.9rem;line-height:1.2}
.kcell .r{font-size:.78rem;color:var(--muted)}
.kcell.seen::after{content:"";position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.kcell.blank{visibility:hidden}

/* ---------- Path ---------- */
.path{display:flex;flex-direction:column;gap:10px}
.node{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--text)}
.node .dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;background:var(--card2);border:2px solid var(--line)}
.node.done .dot{background:var(--ok);color:#fff;border-color:var(--ok)}
.node.prog .dot{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.node.review .dot{background:var(--xp-soft);color:var(--xp);border-color:var(--xp)}
.node.locked{opacity:.55}
.node.check{border-style:dashed;border-width:2px}
.node .grow{flex:1;min-width:0}
.stage-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.stage-h .line{flex:1;height:2px;background:var(--line)}

/* ---------- Quiz ---------- */
.quiz{max-width:720px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qtop .bar{flex:1}
.qmeta{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);text-align:center;margin-bottom:14px}
.qtype{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.qprompt{font-size:1.1rem}
.qbig{font-family:var(--jp);font-size:2.6rem;font-weight:700;line-height:1.3;word-break:break-word}
.qsent{font-family:var(--jp);font-size:1.35rem;line-height:2.1}
.qhint{color:var(--muted);font-size:.92rem;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.05rem;text-align:left;display:flex;gap:10px;align-items:center;min-height:56px;transition:border-color .15s,background .15s,transform .08s}
.opt:hover:not([disabled]){border-color:var(--pri)}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none;color:var(--muted)}
.opt .t{flex:1;font-family:var(--jp);line-height:1.7}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);animation:bounce .35s}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.opt[disabled]{cursor:default}
@keyframes bounce{40%{transform:scale(1.04)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.fb{border-radius:14px;padding:14px;margin-top:14px;text-align:left}
.fb.right{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.wrong{background:var(--bad-soft);border:1px solid var(--bad)}
.xpfloat{position:fixed;left:50%;top:40%;font-weight:800;color:var(--xp);font-size:1.6rem;pointer-events:none;animation:floatup .9s forwards;z-index:90}
@keyframes floatup{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
.bank,.answer{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:54px;padding:10px;border-radius:14px}
.answer{border:2px dashed var(--line);margin-bottom:12px;background:var(--card2)}
.tok{font-family:var(--jp);padding:9px 13px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:1.1rem;box-shadow:0 2px 0 var(--line)}
.tok:active{transform:translateY(1px)}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.qnav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:.8rem;font-weight:700}
.qnav button.done{background:var(--pri-soft);border-color:var(--pri)}
.qnav button.cur{outline:2px solid var(--pri)}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.timer.low{color:var(--bad)}

/* ---------- Flashcard ---------- */
.fc-wrap{perspective:1200px;max-width:520px;margin:0 auto 16px}
.fc{position:relative;width:100%;min-height:320px;transition:transform .55s;transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.fc .front{background:linear-gradient(160deg,var(--card),var(--srs-soft))}
.fc .back{background:var(--card);transform:rotateY(180deg)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:0 auto}
.rate button{padding:12px 4px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.85rem}
.rate .r0{border-color:var(--bad);color:var(--bad)} .rate .r1{border-color:var(--xp);color:var(--xp)} .rate .r2{border-color:var(--info);color:var(--info)} .rate .r3{border-color:var(--ok);color:var(--ok)}
@media (max-width:480px){.rate{grid-template-columns:1fr 1fr}}

/* ---------- Charts ---------- */
.chart{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .b{width:100%;max-width:34px;background:linear-gradient(180deg,var(--pri),var(--srs));border-radius:6px 6px 2px 2px;min-height:2px}
.chart .b.zero{background:var(--line)}
.chart .lbl{font-size:.65rem;color:var(--muted);margin-top:4px;white-space:nowrap}
.chart .val{font-size:.65rem;color:var(--muted)}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--xp) calc(var(--p)*1%),var(--card2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-weight:800;font-size:.95rem;line-height:1.1}
.badge{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.badge .e{font-size:1.8rem;filter:grayscale(1);opacity:.4}
.badge.got{border-color:var(--xp);background:var(--xp-soft)}
.badge.got .e{filter:none;opacity:1}

/* ---------- Text blocks ---------- */
.jp-text{font-family:var(--jp);font-size:1.2rem;line-height:2.3}
.dl-line{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px}
.dl-line.now{background:var(--pri-soft)}
.dl-line .who{font-weight:700;min-width:64px;font-family:var(--jp)}
.ex{padding:10px 12px;border-left:3px solid var(--pri);background:var(--card2);border-radius:0 10px 10px 0;margin:8px 0}
.ex .jp{font-size:1.15rem;line-height:2}
.formula{font-family:var(--jp);background:var(--pri-soft);color:var(--text);padding:10px 14px;border-radius:10px;font-weight:600}
.romaji{color:var(--muted);font-size:.88rem;font-style:italic}
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px}
details.acc>summary{padding:12px 14px;cursor:pointer;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}
details.acc>summary::-webkit-details-marker{display:none}
details.acc[open]>summary{border-bottom:1px solid var(--line)}
details.acc .body{padding:12px 14px}
.hero{background:linear-gradient(135deg,var(--pri),var(--srs));color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.85)}
.hero .btn{border-color:rgba(255,255,255,.5)}
.hero .btn.white{background:#fff;color:var(--pri);border-color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.kv b{color:var(--muted);font-weight:600}

.hero .ring>div{color:var(--text)}
.hero .btn.ghost{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.6)}
.hero .btn.ghost:hover{background:rgba(255,255,255,.26)}
@media (max-width:560px){.topbar .pill{padding:4px 8px;font-size:.78rem}.hide-sm{display:none!important}.hero .btn.big{width:100%}}
</style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand"><div class="logo">日</div><div>Nihongo<br><span class="small muted" style="font-weight:600">Zero → JLPT N3</span></div></div><nav class="nav" id="sidenav"></nav></aside>
  <main class="main"><div class="topbar" id="top"></div><div id="view"><noscript><div class="card">Ứng dụng cần bật JavaScript.</div></noscript></div></main>
</div>
<nav class="bottom-nav" id="bottomnav"></nav>
<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet"><div class="nav" id="sheetnav"></div></div>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sample(a, n) { return shuffle(a).slice(0, n); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
const pad2 = n => String(n).padStart(2, '0');
function todayStr(d = new Date()) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function addDays(str, n) { const [y, m, d] = str.split('-').map(Number); return todayStr(new Date(y, m - 1, d + n)); }
function startOfDay(ts = Date.now()) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
function fmtDate(ts) { if (!ts) return '—'; const d = new Date(ts); return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`; }
function fmtDur(sec) { sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return h ? `${h} giờ ${m} phút` : m ? `${m} phút ${s} giây` : `${s} giây`; }
function fmtClock(sec) { sec = Math.max(0, Math.round(sec)); return `${pad2(Math.floor(sec / 60))}:${pad2(sec % 60)}`; }
function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }
function toast(msg, ms = 2200) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function openModal(html) { closeModal(); const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'modal'; bg.innerHTML = `<div class="modal" role="dialog"><button class="btn icon sm x" data-act="closeModal" aria-label="Đóng">✕</button>${html}</div>`; bg.addEventListener('click', e => { if (e.target === bg) closeModal(); }); document.body.appendChild(bg); }

const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const toHira = s => String(s).replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const H2R = {};
[...KANA_BASIC, ...KANA_DAKU, ...KANA_YOUON].forEach(p => { if (p) H2R[p[0]] = p[1]; });
Object.assign(H2R, { 'を': 'o', 'ぁ': 'a', 'ぃ': 'i', 'ぅ': 'u', 'ぇ': 'e', 'ぉ': 'o', 'ゃ': 'ya', 'ゅ': 'yu', 'ょ': 'yo', 'ゎ': 'wa', 'ゔ': 'vu',
  'ふぁ': 'fa', 'ふぃ': 'fi', 'ふぇ': 'fe', 'ふぉ': 'fo', 'てぃ': 'ti', 'でぃ': 'di', 'とぅ': 'tu', 'どぅ': 'du', 'うぃ': 'wi', 'うぇ': 'we', 'うぉ': 'wo',
  'じぇ': 'je', 'ちぇ': 'che', 'しぇ': 'she', 'ゔぁ': 'va', 'ゔぃ': 'vi', 'ゔぇ': 've', 'ゔぉ': 'vo', 'ふゅ': 'fyu', 'てゅ': 'tyu', 'でゅ': 'dyu' });
function toRomaji(str) {
  const s = toHira(str); let out = '', i = 0;
  const syl = j => { const two = s.substr(j, 2); if (H2R[two]) return H2R[two]; return H2R[s[j]] || ''; };
  while (i < s.length) {
    const c = s[i];
    if (c === 'っ') { const nx = syl(i + 1); if (nx) out += nx.startsWith('ch') ? 't' : nx[0]; i++; continue; }
    if (c === 'ー') { const m = out.match(/[aeiou]$/); out += m ? m[0] : ''; i++; continue; }
    const two = s.substr(i, 2);
    if (H2R[two]) { out += H2R[two]; i += 2; continue; }
    if (H2R[c]) { out += H2R[c]; i++; continue; }
    out += c === '、' ? ', ' : c === '。' ? '. ' : c === '？' ? '? ' : c === '！' ? '! ' : c; i++;
  }
  return out.replace(/\s+/g, ' ').trim();
}
/* Furigana: 漢字[かんじ] ; khoảng trắng tách cụm */
const RUBY_RE = /([㐀-鿿豈-﫿々〆ヶ]+)\[([^\]]+)\]/g;
const F = {
  plain: s => String(s).replace(RUBY_RE, '$1').replace(/ /g, ''),
  kana: s => String(s).replace(RUBY_RE, '$2').replace(/ /g, ''),
  ruby: s => esc(s).replace(RUBY_RE, '<ruby>$1<rt>$2</rt></ruby>').replace(/ /g, ''),
  chunks: s => String(s).trim().split(/ +/),
  romaji: s => String(s).trim().split(/ +/).map(c => toRomaji(F.kana(c))).join(' ')
};
const BLANK = '＿＿';
const blankHTML = '<span style="display:inline-block;min-width:3.2em;border-bottom:3px solid var(--pri);margin:0 .2em">&nbsp;</span>';
/* Chuẩn hóa câu trả lời gõ phím (kana hoặc romaji) */
function normRomaji(r) {
  return String(r).toLowerCase().replace(/[āâ]/g, 'aa').replace(/[ōô]/g, 'ou').replace(/[ūû]/g, 'uu').replace(/[ēê]/g, 'ee').replace(/[īî]/g, 'ii')
    .replace(/[^a-z]/g, '').replace(/wo/g, 'o').replace(/m(?=[bpm])/g, 'n').replace(/ou/g, 'o').replace(/oo/g, 'o').replace(/uu/g, 'u').replace(/aa/g, 'a').replace(/ii/g, 'i').replace(/ee/g, 'e').replace(/ei/g, 'e');
}
function matchTyped(input, accepts) {
  const raw = String(input || '').trim(); if (!raw) return false;
  const kn = toHira(raw).replace(/[\s　、。．.・]/g, '');
  for (const a of accepts) {
    const ak = toHira(F.plain(a)).replace(/[\s　、。]/g, '');
    if (kn === ak) return true;
    if (/[a-zA-Z]/.test(raw) && normRomaji(raw) === normRomaji(toRomaji(ak))) return true;
  }
  return false;
}

const DB = { vocab: [], kanji: [], grammar: [], readings: [], dialogues: [], kana: [], pairs: [], lessons: [], L: {}, items: {}, path: [] };
function lvOf(ls) { if (/^B/.test(ls)) return 'N5'; if (/^M/.test(ls)) return (+ls.slice(1) <= 25) ? 'N5' : 'N4'; return 'N3'; }
function buildDB() {
  // Bài học / lộ trình
  BEGIN_UNITS.forEach(([k, t], i) => DB.lessons.push({ key: k, stage: 'B', num: i + 1, title: t, level: 'Beginner', short: `Nhập môn ${i + 1}` }));
  MINNA_TOPICS.forEach((t, i) => {
    DB.lessons.push({ key: 'M' + (i + 1), stage: i < 25 ? 'M1' : 'M2', num: i + 1, title: t, level: i < 25 ? 'N5' : 'N4', short: `Bài ${i + 1}` });
    if (i === 24) DB.lessons.push({ key: 'MI', stage: 'M1', check: true, title: 'Kiểm tra tổng hợp Minna no Nihongo I', level: 'N5', short: 'Tổng hợp I', range: [1, 25] });
    if (i === 49) DB.lessons.push({ key: 'MII', stage: 'M2', check: true, title: 'Kiểm tra tổng hợp Minna no Nihongo II', level: 'N4', short: 'Tổng hợp II', range: [26, 50] });
  });
  N3_UNITS.forEach((t, i) => DB.lessons.push({ key: 'N3-' + (i + 1), stage: 'N3', num: i + 1, title: t, level: 'N3', short: `Unit ${i + 1}` }));
  DB.lessons.forEach((l, i) => { l.idx = i; DB.L[l.key] = l; });
  DB.path = DB.lessons.map(l => l.key);
  // Từ vựng
  const cnt = {}, seenKey = new Set();
  VOCAB_RAW.trim().split('\n').forEach(line => {
    const f = line.split('|'); if (f.length !== 8) { console.warn('Dòng từ vựng lỗi:', line); return; }
    const [kanji, kana, meaning, type, topic, lesson, ex, exVi] = f.map(s => s.trim());
    if (seenKey.has(kanji + '|' + kana)) { console.warn('Trùng từ:', kanji); return; } seenKey.add(kanji + '|' + kana);
    if (!DB.L[lesson]) { console.warn('Bài không tồn tại:', lesson); return; }
    cnt[lesson] = (cnt[lesson] || 0) + 1;
    const level = lvOf(lesson);
    const id = `${level.toLowerCase()}_${lesson.toLowerCase().replace('-', '')}_${pad2(cnt[lesson])}`;
    const w = { id, key: 'v:' + id, kind: 'v', kanji, kana, romaji: toRomaji(kana), meaning, type, typeLabel: TYPE_LABEL[type] || type, topic, topicLabel: TOPICS[topic] || topic, lesson, level, ex, exVi, hasKanji: kanji !== kana };

    const [ch, on, kun, hv, meaning, words, lesson] = f.map(s => s.trim());

  READINGS.forEach(r => { const o = { ...r, key: 'r:' + r.id, kind: 'r', level: r.lv, lesson: r.ls }; DB.readings.push(o); DB.items[o.key] = o; });

function lessonItems(key) {
  const L = DB.L[key]; if (!L) return { vocab: [], kanji: [], grammar: [], readings: [], dialogues: [], kana: [], pairs: [] };
  let inL;
  if (L.check) { const [a, b] = L.range; inL = ls => /^M\d+$/.test(ls) && +ls.slice(1) >= a && +ls.slice(1) <= b; }
  else inL = ls => ls === key;
  const it = { vocab: DB.vocab.filter(x => inL(x.lesson)), kanji: DB.kanji.filter(x => inL(x.lesson)), grammar: DB.grammar.filter(x => inL(x.lesson)), readings: DB.readings.filter(x => inL(x.lesson)), dialogues: DB.dialogues.filter(x => inL(x.lesson)), kana: [], pairs: [] };
  if (key === 'B1') it.kana = DB.kana.filter(k => k.script === 'hira' && k.group === 'basic');
  if (key === 'B2') it.kana = DB.kana.filter(k => k.script === 'hira' && k.group !== 'basic');
  if (key === 'B3') it.kana = DB.kana.filter(k => k.script === 'kata' && k.group === 'basic');
  if (key === 'B4') it.kana = DB.kana.filter(k => k.script === 'kata' && k.group !== 'basic');
  if (key === 'B5') it.pairs = DB.pairs.slice();

function lessonTabs(L) {

  if (L.key === 'B5') return [['theory', '📖 Lý thuyết'], ['practice', '🎧 Luyện nghe phân biệt'], ['test', '🧪 Kiểm tra']];
  if (/^B[678]$/.test(L.key)) return [['vocab', '📚 Từ vựng'], ...(L.key !== 'B6' ? [['ref', '📋 Bảng tra cứu']] : []), ['practice', '✏️ Bài tập'], ['test', '🧪 Kiểm tra']];

  <div class="tabs">${tabs.map(([k, t]) => `<a href="#/lesson/${key}/${k}" class="${k === tab ? 'on' : ''}">${t}</a>`).join('')}</div><div id="ltab">${body}</div>`;

function testPlan(key) {
  const L = DB.L[key], it = lessonItems(key);
  if (/^B[1-4]$/.test(key)) return { total: Math.min(20, it.kana.length), desc: '20 câu nhận diện chữ: chữ → romaji, romaji → chữ, nghe → chữ.' };
  if (key === 'B5') return { total: Math.min(16, it.pairs.length), desc: '16 câu nghe phân biệt âm ngắt và trường âm.', note: Speech.canListen() ? '' : 'Thiết bị không phát âm được nên không thể làm bài này.' };
  const want = L.check ? { v: 12, g: 10, k: 5, r: 3 } : { v: 8, g: 6, k: 3, r: 3 }; const target = L.check ? 30 : 20;
  const qs = buildLessonTest(key, true); const n = qs.length;
  const desc = L.check ? `${target} câu: ${want.v} từ vựng, ${want.g} ngữ pháp, ${want.k} Kanji, ${want.r} đọc hiểu/nghe hiểu – chỉ lấy từ dữ liệu của các bài trong phạm vi.` : `Mặc định ${target} câu: ${want.v} từ vựng, ${want.g} ngữ pháp, ${want.k} Kanji, ${want.r} đọc hiểu hoặc nghe hiểu – chỉ tạo từ dữ liệu có trong bài.`;
  const parts = {}; qs.forEach(q => parts[q.sec] = (parts[q.sec] || 0) + 1);
  const note = n < target ? `Bài này hiện chỉ đủ dữ liệu để tạo <b>${n}</b> câu (${Object.entries(parts).map(([s, c]) => `${SEC_LABEL[s]}: ${c}`).join(', ')}). Số câu đã được điều chỉnh tương ứng.` : '';
  return { total: n, desc, note };
}
function buildLessonTest(key, dry) {
  const L = DB.L[key], it = lessonItems(key);
  if (/^B[1-4]$/.test(key)) return buildQs(it.kana, KANA_TYPES, 20, { kana: it.kana.length >= 8 ? it.kana : DB.kana.filter(k => k.script === it.kana[0].script) });
  if (key === 'B5') return buildQs(it.pairs, ['mp'], 16);
  const want = L.check ? { v: 12, g: 10, k: 5, r: 3 } : { v: 8, g: 6, k: 3, r: 3 }; const target = L.check ? 30 : 20;
  const used = new Set(); const vt = ['k2m', 'm2k', 'k2h', 'h2k', 'fill', 'h2r', 'trans'];
  const pools = { vocab: DB.vocab.filter(v => v.level === L.level || L.stage === 'B'), kanji: DB.kanji };
  let rl = readingQs(it.readings, want.r, it.dialogues);
  if (rl.length < want.r && it.vocab.length) rl = rl.concat(buildQs(it.vocab, ['listen', 'lmean', 'lsent'], want.r - rl.length, pools, used));
  const g = buildQs(it.grammar, ['gram', 'order'], want.g, pools, used);
  const k = buildQs(it.kanji, ['kc2m', 'kw2r'], want.k, pools, used);
  let v = buildQs(it.vocab, vt, want.v, pools, used);
  let total = v.length + g.length + k.length + rl.length;
  if (total < target) { const more = buildQs(it.vocab, vt.concat(['order']), target - total, pools, used); v = v.concat(more); total += more.length; }
  if (total < target && it.grammar.length) { const more = buildQs(it.grammar, ['gin', 'order', 'gram'], target - total, pools, used); g.push(...more); total += more.length; }
  if (total < target && it.kanji.length) { const more = buildQs(it.kanji, ['m2kc', 'kc2m', 'kw2r'], target - total, pools, used); k.push(...more); }
  return [...v, ...g, ...k, ...rl].slice(0, target);
}
function practiceQs(key, t) {
  const L = DB.L[key], it = lessonItems(key);
  const pools = { vocab: DB.vocab.filter(v => v.level === L.level || L.stage === 'B'), kanji: DB.kanji };
  const N = 10;
  switch (t) {
    case 'kn2r': return buildQs(it.kana, ['kn2r'], 15, { kana: it.kana.length >= 8 ? it.kana : DB.kana.filter(k => k.script === it.kana[0].script) });
    case 'memo': return buildQs(it.kana, ['r2kn', 'knl'], 15, { kana: it.kana.length >= 8 ? it.kana : DB.kana.filter(k => k.script === it.kana[0].script) });
    case 'mp': return buildQs(it.pairs, ['mp'], 12);
    case 'vocab': return buildQs(it.vocab, ['k2m', 'm2k', 'k2h', 'h2k', 'r2h', 'h2r'], N, pools);
    case 'kanji': return buildQs(it.kanji, KANJI_TYPES, N, pools);
    case 'grammar': return shuffle([].concat(...it.grammar.map(g => g.q.map((_, i) => genGrammar(g, 'gram', i))))).filter(Boolean).slice(0, N);
    case 'fill': return buildQs(it.vocab, ['fill'], N, pools);
    case 'order': return buildQs([...it.vocab, ...it.grammar], ['order'], N, pools);
    case 'gin': return buildQs(it.grammar, ['gin'], N);
    case 'trans': return buildQs(it.vocab, ['trans'], N, pools);
    case 'conj': { const upto = L.stage === 'N3' ? 999 : +L.key.slice(1); const verbs = DB.vocab.filter(v => /^v/.test(v.type) && /^M\d+$/.test(v.lesson) && +v.lesson.slice(1) <= upto || (L.stage === 'N3' && /^v/.test(v.type))); return buildQs(verbs, ['conj'], N, pools); }
    case 'listen': case 'lmean': case 'ltype': case 'lsent': return buildQs(it.vocab, [t], N, pools);
    case 'dlg': return it.dialogues.map(genDialogue).filter(Boolean);
    case 'mixed': default: return buildQs([...it.vocab, ...it.grammar, ...it.kanji], [...VOCAB_TYPES.filter(x => x !== 'conj'), ...GRAMMAR_TYPES, ...KANJI_TYPES], N, pools);
  }
}
function lessonTestFinish(key) {
  return r => {
    const L = S.lessons[key] || (S.lessons[key] = { attempts: 0, best: null, passed: false });
    L.attempts = (L.attempts || 0) + 1; L.best = Math.max(L.best || 0, r.acc); L.last = r.acc; L.lastAt = Date.now();
    let h = '<div style="margin-top:14px">';
    if (S.testXp[key] !== todayStr()) { S.testXp[key] = todayStr(); addXP(100, false); h += `<div class="pill xp">+100 XP hoàn thành bài kiểm tra</div> `; }
    else h += `<div class="tiny muted">(XP hoàn thành bài kiểm tra này đã được nhận hôm nay)</div>`;
    if (r.acc >= 80) { if (!L.passed) { L.passed = true; L.passedAt = Date.now(); addXP(50, false); h += `<div class="pill xp">+50 XP hoàn thành bài học</div>`; }
      const nx = DB.path[DB.path.indexOf(key) + 1];

    } else h += `<div class="card warn" style="margin-top:12px"><b>Chưa đạt 80%.</b> Hãy ôn lại các mục sai (đã lưu vào “Từ cần ôn”), luyện tập thêm rồi làm lại bài kiểm tra.</div>`;
    save(); return h + '</div>';
  };
}

function grammarSet(g) {
  const qs = [];
  g.q.forEach((_, i) => { const q = genGrammar(g, 'gram', i); if (q) qs.push(q); });
  g.ex.forEach((_, i) => { if (qs.length < 6) { const q = genGrammar(g, 'order', i); if (q) qs.push(q); } });
  g.q.forEach((_, i) => { const q = genGrammar(g, 'gin', i); if (q) qs.push(q); });
  return shuffle(qs);
}

function readinessHTML(lv) {

function buildJLPT() {
  const lv = JP.lv, big = JP.size === 'std'; const n = big ? { vocab: 14, grammar: 12, reading: 6, listening: 8 } : { vocab: 7, grammar: 6, reading: 3, listening: 4 };
  const vp = DB.vocab.filter(v => v.level === lv), kp = DB.kanji.filter(k => k.level === lv), gp = DB.grammar.filter(g => g.level === lv);
  const pools = { vocab: vp, kanji: kp.length >= 8 ? kp : DB.kanji }; const used = new Set(); let qs = []; const notes = [];
  if (JP.secs.vocab) { const nk = Math.round(n.vocab * 0.3); qs = qs.concat(buildQs(vp, ['k2m', 'm2k', 'k2h', 'h2k', 'fill'], n.vocab - nk, pools, used), buildQs(kp, ['kc2m', 'kw2r'], nk, pools, used).map(q => Object.assign(q, { sec: 'vocab' }))); }
  if (JP.secs.grammar) qs = qs.concat(buildQs(gp, ['gram', 'gram', 'order'], n.grammar, pools, used));
  if (JP.secs.reading) { let r = readingQs(DB.readings.filter(x => x.level === lv), n.reading); if (r.length < n.reading) { notes.push('Phần đọc được bổ sung bằng câu hỏi đọc hiểu câu ngắn.'); r = r.concat(buildQs(vp, ['trans'], n.reading - r.length, pools, used).map(q => Object.assign(q, { sec: 'reading' }))); } qs = qs.concat(r); }
  if (JP.secs.listening) { if (!Speech.canListen()) notes.push('Bỏ qua phần nghe vì thiết bị không có giọng đọc tiếng Nhật.'); else { const dl = shuffle(DB.dialogues.filter(d => d.level === lv)).slice(0, Math.ceil(n.listening / 3)).map(genDialogue); qs = qs.concat(dl, buildQs(vp, ['listen', 'lmean', 'lsent'], n.listening - dl.length, pools, used)); } }
  return { qs, notes };
}

function quizForKeys(keys, n) {
  const qs = []; const used = new Set();
  for (const k of shuffle(keys)) {
    if (qs.length >= n) break;
    const parts = k.split(':'); const base = parts.slice(0, 2).join(':'); const it = DB.items[base]; if (!it) continue;
    let q = null;
    if (it.kind === 'v') q = buildQs([it], ['k2m', 'm2k', 'k2h', 'h2k', 'fill', 'listen', 'r2h'], 1, {}, used)[0];
    else if (it.kind === 'k') q = buildQs([it], KANJI_TYPES, 1, {}, used)[0];
    else if (it.kind === 'g') q = buildQs([it], GRAMMAR_TYPES, 1, {}, used)[0];
    else if (it.kind === 'kana') q = buildQs([it], KANA_TYPES, 1, {}, used)[0];
    else if (it.kind === 'mp' && Speech.canListen()) q = genPair(it);
    else if (it.kind === 'r') q = genReading(it, +parts[2]);
    else if (it.kind === 'd' && Speech.canListen()) q = genDialogue(it);
    if (q) qs.push(q);
  }
  return qs;
}

document.addEventListener('click', e => {

function route() {

  const name = VIEWS[parts[0]] ? parts[0] : 'home';
  try { VIEWS[name](...parts.slice(1).filter(Boolean)); } catch (e) { console.error(e); V().innerHTML = `<div class="card warn">Đã xảy ra lỗi khi hiển thị trang: ${esc(e.message)}. <a href="#/home">Về trang chủ</a></div>`; }
  const nav = NAV_ALIAS[name] === 'path' && /^M/.test(parts[1] || '') ? 'minna' : (NAV_ALIAS[name] || name);
  $$('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === nav));
  window.scrollTo(0, 0); updateTop();
}
/* Đo thời gian học thực tế: cộng 15 giây mỗi chu kỳ nếu tab đang mở và có thao tác trong 90 giây gần nhất */

['click', 'keydown', 'touchstart', 'scroll'].forEach(ev => document.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true }));
function init() {

  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
  route(); checkAch();
  if (!storageOK) toast('⚠️ Trình duyệt đang chặn localStorage – tiến trình sẽ không được lưu.', 5000);
}
document.addEventListener('DOMContentLoaded', init);
